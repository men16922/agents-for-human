<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090" role="img" aria-labelledby="title desc">
<title id="title">Rehearsal: local transaction rehearsal architecture</title>
<desc id="desc">A frozen comparison roster connects Strands practice and tool-free review to an independent Medusa gateway. Learning and external execution share usage limits. Public observations feed a bounded reaction wrapper and a read-only browser. Selected execution records undergo file-integrity checks, while raw transaction exports undergo separate independent verification. Actual Nova execution is recorded; model superiority remains unproven.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3Z" fill="#61758e"/></marker>
<style>
text{font-family:Arial,sans-serif;fill:#172c46}.heading{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#4d637e}.label{font-size:21px;font-weight:700}.small{font-size:16px}.panel{fill:#fff;stroke:#c8d5e5;stroke-width:2}.arrow{fill:none;stroke:#61758e;stroke-width:2;marker-end:url(#arrow)}.pill{font-size:16px;font-weight:700;fill:#7a4519}
</style>
</defs>
<rect width="1400" height="1090" fill="#f3f6fb"/>
<text x="50" y="58" class="heading">Rehearsal — transaction rehearsal and independent evidence</text>
<text x="50" y="90" class="sub">Implemented local paths • Actual Amazon Nova 2 Lite / Strands / Medusa execution verified</text>
<rect x="50" y="127" width="1300" height="58" rx="12" fill="#e1eaf6"/>
<text x="76" y="163" class="label">Developer: fixed goal, policies, model limits and planned B0/B1/B2/B3 cells</text>
<path d="M265 185V226" class="arrow"/><path d="M700 185V226" class="arrow"/><path d="M1120 185V226" class="arrow"/>
<rect x="50" y="228" width="410" height="202" rx="14" class="panel"/>
<text x="74" y="265" class="label">Strands execution and review</text>
<text x="74" y="303" class="small">B2: one Agent; B3: independent review</text>
<text x="74" y="331" class="small">Fresh reviewer: evidence only, no tools</text>
<text x="74" y="359" class="small">Schema-checked policy proposals</text>
<text x="74" y="397" class="sub">No automatic policy promotion</text>
<rect x="495" y="228" width="410" height="202" rx="14" class="panel"/>
<text x="519" y="265" class="label">Practice world and isolated fork</text>
<text x="519" y="303" class="small">Separate shop and payment ledgers</text>
<text x="519" y="331" class="small">Controlled conditions and virtual time</text>
<text x="519" y="359" class="small">Coherent snapshot → new experiment</text>
<text x="519" y="397" class="sub">Parent world and policy preserved</text>
<rect x="940" y="228" width="410" height="202" rx="14" class="panel"/>
<text x="964" y="265" class="label">Independent commerce path</text>
<text x="964" y="303" class="small">Buyer HTTP gateway: run and ownership</text>
<text x="964" y="331" class="small">Budget reservation → Medusa backend</text>
<text x="964" y="359" class="small">Separate seller process → delivery</text>
<text x="964" y="397" class="sub">Synthetic credits • Loopback only</text>
<path d="M460 321H493" class="arrow"/><path d="M460 285H477V208H925V321H938" class="arrow"/>
<text x="50" y="114" class="small">Purchasing tools select the practice world or the independent HTTP adapter.</text>
<path d="M255 430V496" class="arrow"/><path d="M700 430V496" class="arrow"/><path d="M1145 430V496" class="arrow"/>
<rect x="50" y="500" width="410" height="173" rx="14" class="panel"/>
<text x="74" y="538" class="label">Shared durable admission ledger</text>
<text x="74" y="576" class="small">Learning + external execution, same ledger</text>
<text x="74" y="604" class="small">Call / cost / token / tool limits and roles</text>
<text x="74" y="640" class="sub">Unknown usage retains reservations</text>
<rect x="495" y="500" width="410" height="173" rx="14" class="panel"/>
<text x="519" y="538" class="label">Independent evidence verifier</text>
<text x="519" y="576" class="small">Raw practice and commerce exports</text>
<text x="519" y="604" class="small">Spending, reservations, receipts, deadline</text>
<text x="519" y="640" class="sub">Saved success text is not authority</text>
<rect x="940" y="500" width="410" height="173" rx="14" class="panel"/>
<text x="964" y="538" class="label">Read-only observation</text>
<text x="964" y="576" class="small">Durable journal → SSE → observer bridge</text>
<text x="964" y="604" class="small">React UI: freshness and cursor recovery</text>
<text x="964" y="640" class="sub">No purchase or administrator actions</text>
<path d="M1145 473H820V496" class="arrow"/>
<path d="M905 585H938" class="arrow"/>
<path d="M1145 673V698H350V723" class="arrow"/>
<text x="545" y="692" class="small">Public journal also feeds the buyer's independent consumer</text>
<rect x="50" y="725" width="630" height="170" rx="14" class="panel"/>
<text x="74" y="762" class="label">Bounded reactions before HTTP actions</text>
<text x="74" y="797" class="small">Latest semantic change → fresh decision context; shared limits</text>
<text x="74" y="825" class="small">Recheck state/quote before orders or payments; block stale actions</text>
<text x="74" y="863" class="sub">The model chooses any replacement through its tools</text>
<path d="M680 806H718" class="arrow"/>
<rect x="720" y="725" width="630" height="170" rx="14" class="panel"/>
<text x="744" y="762" class="label">Selected execution records → read-only UI</text>
<text x="744" y="797" class="small">Pinned run/goal/budget/spec; audit replay and terminal hashes</text>
<text x="744" y="825" class="small">Provisional records do not prove process liveness</text>
<text x="744" y="863" class="sub">File integrity is separate from the transaction verdict</text>
<path d="M350 895V928" class="arrow"/><path d="M1035 895V928" class="arrow"/>
<rect x="50" y="930" width="1300" height="70" rx="12" fill="#dfeee9"/>
<text x="76" y="958" class="label">Reviewable artifacts: raw evidence, policy diff, usage, failures and missing evaluation cells</text>
<text x="76" y="983" class="small">Actual Nova/Medusa runs include successful recovery and failure; neither proves learned-policy or Peer Review efficacy.</text>
<rect x="50" y="1020" width="1300" height="43" rx="10" fill="#fff0d9"/>
<text x="72" y="1048" class="pill">Still unverified: policy improvement • held-out generalization • user time savings • public judging access</text>
</svg>

[project]
name = "rehearsal"
version = "0.1.0"
description = "Development foundation for the Rehearsal transaction-agent POC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "strands-agents==1.54.0",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "mypy==2.3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/rehearsal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/rehearsal"]
